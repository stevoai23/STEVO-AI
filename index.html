 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEVO-AI</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:15px}
h1{text-align:center} h1 span{color:#00ff88}
p{text-align:center;color:#aaa;font-size:13px}
#chat{display:flex;flex-direction:column;gap:10px;margin-bottom:80px}
.msg{padding:12px 15px;border-radius:15px;max-width:85%;line-height:1.5}
.ai{background:#222;align-self:flex-start}
.me{background:#00ff88;color:#000;align-self:flex-end}
#box{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff;outline:none}
button{background:#00ff88;border:none;padding:12px 20px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<h1>STEVO-<span>AI</span></h1>
<p>Online = Smart like Meta AI | Offline = Still go answer you</p>
<div id="chat"><div class="msg ai">Hello! I be STEVO-AI. Ask me anything. If you get data I go use big brain, if not I go use offline brain.</div></div>
<div id="box"><input id="input" placeholder="Type your message..."><button onclick="send()">Send</button></div>

<script>
async function send(){
  let inp = document.getElementById('input');
  let text = inp.value.trim();
  if(!text) return;
  addMsg(text, 'me');
  inp.value = '';
  let thinking = addMsg("Thinking... 🤔", 'ai');
  let ans = await getAnswer(text);
  thinking.innerText = ans;
  window.scrollTo(0, document.body.scrollHeight);
}
function addMsg(t, cls){
  let c = document.getElementById('chat');
  let d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerText = t;
  c.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}
function offlineReply(t){
  let m = t.toLowerCase();
  if(m.includes('hi') || m.includes('hello') || m.includes('hey')) return "Hello my guy! How you dey? Wetin I go do for you today?";
  if(m.includes('how are you') || m.includes('how you dey') || m.includes('how far')) return "I dey fine, I dey strong! Na you, how your side? You chop?";
  if(m.includes('who are you') || m.includes('your name')) return "I be STEVO-AI, your sharp guy assistant. Na Stevo build me for Lagos. I fit help you with questions, jokes, advice, maths, anything!";
  if(m.includes('joke')) return "Why chicken cross road? To go charge phone for neighbour house because NEPA don take light! 😂 Want another one?";
  if(m.includes('motivat') || m.includes('tired') || m.includes('sad')) return "My guy no give up o. Every big person start small. Small small e go pay. You go make am, just keep pushing. I believe you!";
  if(m.includes('money') || m.includes('rich') || m.includes('business')) return "To make money: 1. Learn one skill like coding, design or selling. 2. Start small with wetin you get. 3. Post am for TikTok/WhatsApp everyday. Consistency na the secret! (Offline mode)";
  if(m.includes('thank')) return "You are welcome my guy! Anytime you need me, I dey here.";
  if(m.includes('bye')) return "Alright, take care o! Come back anytime. STEVO-AI dey for you.";
  if(m.includes('+') || m.includes('-') || m.includes('*') || m.includes('/')){
    try{ return "Answer na: " + eval(m.replace(/[^0-9+\-*/(). ]/g,'')); }catch(e){}
  }
  return "I dey offline now, so my small brain dey work. But I hear you. If you on your data, I go answer you like Meta AI. Try ask me for joke, money, or motivation.";
}
async function getAnswer(t){
  // Try ONLINE big brain first
  try{
    let res = await fetch("https://text.pollinations.ai/" + encodeURIComponent("You are STEVO-AI, a friendly Nigerian assistant. Answer in simple English with small pidgin, like a smart friend. Question: " + t), {signal: AbortSignal.timeout(15000)});
    if(!res.ok) throw new Error("fail");
    let answer = await res.text();
    if(answer && answer.length > 5) return answer;
    throw new Error("empty");
  }catch(e){
    // If internet fail, use OFFLINE brain
    return offlineReply(t) + "\n\n[Offline Mode - On your data for full smart answer]";
  }
}
document.getElementById('input').addEventListener('keypress', function(e){ if(e.key==='Enter') send(); });
</script>
</body>
</html>
